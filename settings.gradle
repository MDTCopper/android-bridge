pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven { url = 'https://maven.google.com' }
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        mavenLocal()
        mavenCentral()
        maven { url = 'https://maven.google.com' }
    }
}

rootProject.name = 'android-bridge'

// no arc or game dependency: the JNI bindings, the ART side activity, the version table.
include 'core'

// a compiled processor is needed before :core can be compiled, and it depends on nothing:
// annotations are looked up by name, which is what keeps this from being a cycle.
include 'processor'

// the version branches, one project each under bridge/: they share a build file but no code.
include 'bridge:v1'  // the Audio-interface 6 line, compiled against v83
include 'bridge:v2'  // the pre-ClientLauncher 6 line, compiled against v91
include 'bridge:v3'  // the Consumer/FileHandle 6 line, compiled against release 99
include 'bridge:v4'  // the FileHandle/Cons 6 line, compiled against 6315
include 'bridge:v5'  // the Fi/Cons 6 line, compiled against 6415
include 'bridge:v6'  // the array-era 6 line, compiled against 8657
include 'bridge:v7'  // the Seq/audio 6 line and the 7 line, compiled against v112
include 'bridge:v8'  // the 7 and 8 line, compiled against v159
include 'bridge:v9'  // Mindustry 9: Arc merged into the game repository

// libcopperbridge.so for every ABI, in the same task graph so its result is staged where pack
// expects it; not a Java module.
include 'native'

// the deployable jar: dex, the lwjgl classes and natives, the .so, the version table.
include 'pack'

// the build-time API guard: reads the bridge's compiled references and compares the arc/mindustry
// declarations at the two ends of the branch's range. No game or arc build is involved.
include 'compat'

// No includeBuild for the game: an epoch is the desktop jar the game itself ships, which already
// carries arc, so there is no source tree to configure or compile here.
