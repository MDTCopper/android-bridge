// --- enhance and API check ---------------------------------------------------
//
// A branch is compiled against one epoch but runs on every version of its range. Two things stand between the
// compiled classes and the jar: methods a branch had to declare under a build name are renamed to the game's name,
// and every arc/mindustry reference is compared at the two ends of the branch's range. Both ends are official desktop
// jars staged by the epoch machinery, which is the only place that fetches them; the check is handed the staged
// files. A class can narrow its ends with @CompatRange, and a ref such a class names beyond the ones below is listed
// in <branch>.compatRefs.

def compatClasses = project(':compat').sourceSets.main.output
def coreClasses = project(':core').sourceSets.main.output.classesDirs.singleFile
def declaredBranches = project.ext.branchNames
def enhancedRoot = layout.buildDirectory.dir('enhanced').get().asFile
def checkedBranches = declaredBranches.findAll { findProperty("${it}.compatFloor") }
def propertiesPath = rootProject.file('gradle.properties').absolutePath

// Some branches have a second source set compiled against their floor; pack reads it by its conventional output path
// because a cross-project sourceSets lookup at pack's configuration time races that project's configuration.
def legacyBranches = ['v1', 'v2', 'v4', 'v6', 'v9', 'v10']

def classDirs = declaredBranches.collectEntries { String branch ->
    def dirs = [project(":bridge:${branch}").sourceSets.main.output.classesDirs.singleFile]
    if (branch in legacyBranches)
        dirs.add(new File(rootProject.projectDir, "bridge/${branch}/build/classes/java/legacy"))
    [(branch): dirs]
}

// The branch classes after the build-name renames. The check and the jar only ever see this directory.
tasks.register('enhanceBranches', JavaExec) {
    group = 'pack'
    description = "Renames the methods a branch declared under a build name to their game names."
    dependsOn ':compat:classes'
    declaredBranches.each {
        dependsOn ":bridge:${it}:compileJava"
        if (it in legacyBranches)
            dependsOn ":bridge:${it}:compileLegacyJava"
    }
    classpath = project(':compat').sourceSets.main.runtimeClasspath
    mainClass = 'copper.bridge.compat.enhance.Enhancer'
    args '--out', enhancedRoot.absolutePath
    classDirs.each { String branch, List dirs ->
        dirs.each { File dir -> args '--classes', branch + '=' + dir.absolutePath }
    }
    inputs.files(compatClasses)
    inputs.files(classDirs.values().flatten())
    outputs.dir(enhancedRoot)
}

// Both ends of the range, the epoch the branch compiles against - which is where a class that only has
// the newer shape starts - and whatever @CompatRange names beyond those.
def compatRefs = { String branch ->
    def refs = [findProperty("${branch}.compatFloor"), findProperty("${branch}.compatCeiling"),
                findProperty("${branch}.mindustryRef")]
    refs.addAll((findProperty("${branch}.compatRefs") ?: '').toString().split(','))
    return refs.collect { it.toString().trim() }.findAll { it }.unique()
}

checkedBranches.each { String branch ->
    def bridgeClasses = new File(enhancedRoot, branch)
    def refs = compatRefs(branch)
    tasks.register("checkBridgeApi${branch.capitalize()}", JavaExec) {
        group = 'pack'
        description = "Checks ${branch}'s arc/mindustry references against its API range."
        dependsOn 'enhanceBranches'
        classpath = project(':compat').sourceSets.main.runtimeClasspath
        mainClass = 'copper.bridge.compat.Check'
        args = [
                '--branch', branch,
                '--properties', propertiesPath,
                '--bridge', bridgeClasses.absolutePath
        ]
        // staged here, at build time; a ref that is already there costs nothing
        doFirst {
            refs.each { String ref ->
                args '--jar', "${ref}=${rootProject.ext.fetchEpoch(ref).absolutePath}"
            }
            // The layer the check resolves a reference in after the branch itself: what the bridge jar carries
            // besides the branches (its shared classes and lwjgl). The game jar is only consulted after these.
            args '--epoch', findProperty("${branch}.mindustryRef")
            args '--bridge-classpath', coreClasses.absolutePath
            configurations.lwjglJava.files.each { File jar -> args '--bridge-classpath', jar.absolutePath }
        }
        dependsOn ':core:classes'
        inputs.files(compatClasses)
        inputs.file(propertiesPath)
        inputs.dir(bridgeClasses)
        inputs.dir(coreClasses)
        inputs.files(configurations.lwjglJava)
    }
}

tasks.register('checkBridgeApi') {
    group = 'pack'
    description = "Runs every branch's API check."
    dependsOn checkedBranches.collect { "checkBridgeApi${it.capitalize()}" }
}

// --- source history audit ----------------------------------------------------
//
// The endpoint check cannot see a type or member that disappears and reappears inside a range. These audits read the
// game and arc source clones at every commit. A branch with a BE range uses its BE endpoints: the release interval
// must lie inside it, checked by checkWindowContainment, so a release-only endpoint cannot hide a change. The build-id
// commits come from gradle.properties; the audits never download a jar.

def mindustryClone = findProperty('mindustryClone') ? file(findProperty('mindustryClone'))
        : rootProject.file('../Mindustry')
def arcClone = findProperty('arcClone') ? file(findProperty('arcClone')) : rootProject.file('../Arc')
def releaseTag = { String version -> 'v' + (version.endsWith('.0') ? version[0..-3] : version) }
def auditBranches = declaredBranches.findAll { findProperty("${it}.minVersionNumber") || findProperty("${it}.minBeBuild") }
def effectiveFrom = { String branch ->
    def build = findProperty("${branch}.minBeBuild")
    return build ? build.toString() : releaseTag(findProperty("${branch}.minVersionNumber").toString())
}
def effectiveTo = { String branch ->
    def build = findProperty("${branch}.maxBeBuild")
    if (build)
        return build.toString()
    def version = findProperty("${branch}.maxVersionNumber")
    return version ? releaseTag(version.toString()) : 'HEAD'
}
def epochJarFor = { String branch ->
    rootProject.ext.epochClasspath(branch).files.find {
        it.name.endsWith('.jar') && !it.name.endsWith('-sources.jar')
    }
}

auditBranches.each { String branch ->
    def framework = findProperty("${branch}.framework") ?: 'arc'
    tasks.register("auditTypeHistory${branch.capitalize()}", JavaExec) {
        group = 'pack'
        description = "Audits ${branch}'s referenced types across its commits."
        dependsOn 'enhanceBranches'
        classpath = project(':compat').sourceSets.main.runtimeClasspath
        mainClass = 'copper.bridge.compat.audit.TypeHistoryAudit'
        args '--branch', branch, '--classes', new File(enhancedRoot, branch).absolutePath,
                '--mindustry', mindustryClone.absolutePath,
                '--jars', new File(rootProject.projectDir, '.mindustry').absolutePath,
                '--properties', rootProject.file('gradle.properties').absolutePath,
                '--from', effectiveFrom(branch), '--to', effectiveTo(branch)
        if (framework == 'arc')
            args '--arc', arcClone.absolutePath
        else
            args '--no-arc'
        def epoch = epochJarFor(branch)
        if (epoch)
            args '--epoch', epoch.absolutePath
        doFirst {
            if (!new File(mindustryClone, '.git').isDirectory()
                    || (framework == 'arc' && !new File(arcClone, '.git').isDirectory()))
                throw new GradleException("source audit needs the game clone"
                        + (framework == 'arc' ? " and the arc clone" : "")
                        + "; pass -PmindustryClone and -ParcClone")
        }
    }
    tasks.register("auditMemberHistory${branch.capitalize()}", JavaExec) {
        group = 'pack'
        description = "Audits ${branch}'s methods, fields and nested classes across its commits."
        dependsOn 'enhanceBranches'
        classpath = project(':compat').sourceSets.main.runtimeClasspath
        mainClass = 'copper.bridge.compat.audit.MemberHistoryAudit'
        args '--branch', branch, '--classes', new File(enhancedRoot, branch).absolutePath,
                '--mindustry', mindustryClone.absolutePath,
                '--jars', new File(rootProject.projectDir, '.mindustry').absolutePath,
                '--properties', rootProject.file('gradle.properties').absolutePath,
                '--from', effectiveFrom(branch), '--to', effectiveTo(branch)
        if (framework == 'arc')
            args '--arc', arcClone.absolutePath
        else
            args '--no-arc'
        def epoch = epochJarFor(branch)
        if (epoch)
            args '--epoch', epoch.absolutePath
        doFirst {
            if (!new File(mindustryClone, '.git').isDirectory()
                    || (framework == 'arc' && !new File(arcClone, '.git').isDirectory()))
                throw new GradleException("member audit needs the game clone"
                        + (framework == 'arc' ? " and the arc clone" : "")
                        + "; pass -PmindustryClone and -ParcClone")
        }
    }
}

tasks.register('auditTypeHistory') {
    group = 'pack'
    description = "Audits every branch's referenced types across its effective window."
    dependsOn auditBranches.collect { "auditTypeHistory${it.capitalize()}" }
}

tasks.register('auditMemberHistory') {
    group = 'pack'
    description = "Audits every branch's methods, fields and nested classes across its effective window."
    dependsOn auditBranches.collect { "auditMemberHistory${it.capitalize()}" }
}

def containmentBranches = auditBranches.findAll {
    findProperty("${it}.minVersionNumber") && findProperty("${it}.minBeBuild") && findProperty("${it}.maxBeBuild")
}
containmentBranches.each { String branch ->
    tasks.register("checkWindow${branch.capitalize()}", JavaExec) {
        group = 'pack'
        description = "Checks ${branch}'s release interval lies inside its BE interval."
        classpath = project(':compat').sourceSets.main.runtimeClasspath
        mainClass = 'copper.bridge.compat.audit.WindowContainment'
        args '--branch', branch,
                '--mindustry', mindustryClone.absolutePath,
                '--properties', rootProject.file('gradle.properties').absolutePath,
                '--release-from', releaseTag(findProperty("${branch}.minVersionNumber").toString()),
                '--be-from', findProperty("${branch}.minBeBuild").toString(),
                '--be-to', findProperty("${branch}.maxBeBuild").toString()
        def releaseTo = findProperty("${branch}.maxVersionNumber")
        if (releaseTo)
            args '--release-to', releaseTag(releaseTo.toString())
    }
}

tasks.register('checkWindowContainment') {
    group = 'pack'
    description = "Checks every release interval lies inside its branch's BE interval."
    dependsOn containmentBranches.collect { "checkWindow${it.capitalize()}" }
}

tasks.register('auditSourceHistory') {
    group = 'pack'
    description = "Checks window containment and runs the type and member source-history audits."
    dependsOn 'checkBridgeApi', 'checkWindowContainment', 'auditTypeHistory', 'auditMemberHistory'
}
