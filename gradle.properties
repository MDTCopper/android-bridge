# Only -Prelease uses this version; every other build is "snapshot".
buildVersion=0.1.3

# lwjgl, for the java bindings (maven) and the android natives pack downloads at build time.
lwjglVersion=3.4.1
lwjglReleaseBase=https://github.com/MDTCopper/android-lwjgl3/releases/download

# The full Mindustry and Arc clones, the source of every epoch. Both must be full clones: the epochs
# below are checked out by ref from them. A merged epoch - arc living inside the game repository -
# needs only the game clone, and says so by leaving its arc ref empty.
mindustryDir=../Mindustry
arcDir=../Arc

# Android SDK: android.jar on the compile classpath, and the NDK and cmake :native builds with.
# All three are pinned: another NDK or cmake changes the codegen, and the platform level has to be the
# shipped minimum.
ndkVersion=29.0.14206865
cmakeVersion=3.22.1
minAndroidApi=30

# --- version branches -------------------------------------------------------
#
# A branch declares three things: the game ref it is compiled against, the arc ref it needs beside it,
# and the version ranges that decide which jars it runs.
#
# A ref is a git ref of the two clones above - a tag, or a commit when the epoch has no tag, which is
# how a game that has not released yet is pinned. An empty arc ref means arc ships inside the game
# repository and has no checkout of its own: the second ref, and the Arc clone, are then not used.
#
# The ranges are independent - min/maxVersionNumber for official releases, min/maxBeBuild for
# bleeding-edge build ids. An empty bound is unbounded; a scale with both bounds empty is not claimed
# by the branch at all, so that kind of jar never matches it. A jar is matched against the range for
# its release type, never across the two.

# v1 is the 6, 7 and 8 line: releases 105.0 up (open at the top), bleeding-edge builds 8774 up. The floor is
# not a release tag: 4a8be42258 ("Lowercase enums") is where the API reshape of the 6 line completed, and 8774
# is the first build cut from it. Before that commit the same code compiled but the declarations it references
# still had the old shape - 164 incompatibilities at v104.6, 10 at the build before this one. 27928 is the last
# build of the 8 line, where the branch stops. Its epoch is the newest shape the branch meets; every symbol it
# references must also exist at the range's floor, which :pack:checkBridgeApi enforces.
v1.mindustryRef=v159
v1.arcRef=v159
v1.minVersionNumber=105.0
v1.maxVersionNumber=
v1.minBeBuild=8774
# 27928 is the last build of the v8 line. 27929 was the first cut of Mindustry 9: it failed and
# produced no release, but the id is spent, so that is where the v9 range starts.
v1.maxBeBuild=27928

# v2: Mindustry 9, the epoch where Arc was merged into the game repository. Upstream has no v9 tag
# yet, so the game ref is a commit and is bumped by hand; arc has no ref of its own any more, so that
# line is empty and the epoch stages the arc jars the game's own build produces inside its tree. The
# branch switches on bleeding-edge build ids at 27929; there is no official v9 release yet, so the
# release range stays undeclared and this entry claims no release at all. Add minVersionNumber when
# the first v9 release exists - until then such a jar resolves to the closest branch with a warning
# instead of silently running the wrong one.
v2.mindustryRef=800f2316f7
v2.arcRef=
v2.minVersionNumber=
v2.maxVersionNumber=
v2.minBeBuild=27929
v2.maxBeBuild=

# Epoch artifacts land in .mindustry/<mindustryRef>/; an epoch with an arc of its own also fills
# .arc/<mindustryRef>/. The arc ref is a tag or a commit of the Arc clone, and a merged epoch leaves
# it empty - its arc is built out of the game's own tree and staged beside the game's jars.

# --- API check --------------------------------------------------------------
#
# The check reads the compiled branch classes and compares the arc/mindustry declarations they reference at
# the two ends of the branch's bleeding-edge range. The floor is 4a8be42258, the commit that completed the API
# reshape (BE 8774); the ceiling is 27928, the last build of the 8 line. The arc side is the archash each game
# commit declares. A class that is only loaded on newer epochs overrides its file's ends with @CompatRange.

v1.compatMindustryFloor=4a8be422588e60ffe44c3ae461c52cd2228fff66
v1.compatMindustryCeiling=f3bfa418a5e8d7d7d98540a0da62b9f19bc845cb
v1.compatArcFloor=23b2fc721fa7ebb52e2edb0ce72b87731050e76e
v1.compatArcCeiling=7445105cd2683daf5b9ac7033ebb07265d3e814d

# v2: Mindustry 9. The first v9 build (27930) predates the arc merge and names an Arc commit that is not in
# the public Arc repository, so the arc side starts at the merge commit (65ade81fb6); the game side runs from
# the first build to the 28063 commit, which is also the branch epoch. Pre-merge v9 arc trees cannot be
# checked until that Arc commit is published.
v2.compatMindustryFloor=a49ad984452906e1b35144d67026e78ce1459ba9
v2.compatMindustryCeiling=800f2316f76d62486cac1aae41927c97dd714ded
v2.compatArcFloor=65ade81fb62a5e6fbc8d834c55b15695dc52b682
v2.compatArcCeiling=800f2316f76d62486cac1aae41927c97dd714ded
v2.compatArcFloorMerged=true
v2.compatArcCeilingMerged=true
