// Build logic lives in gradle/: the version stamp, the epoch machinery, and the enhance/check steps pack applies.
// This file only applies them and holds the settings shared by every Java subproject.

apply from: "$rootDir/gradle/version.gradle"
apply from: "$rootDir/gradle/epochs.gradle"

configure(subprojects - project(':native') - project(':bridge')) {
    apply plugin: 'java-library'

    group = 'com.github.MDTCopper.bridge'
    version = buildVersion

    java {
        // both sides share the classes, and the ART side runs on Android 11 (API 30), so Java 11
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-Xlint:deprecation']
    }

    // The bridge jar comes first on the runtime classpath, so the classes it carries win over a game jar's
    // copy of the same class. A branch's compile classpath has to resolve the same way: Gradle puts the epoch
    // file dependency first, so the bridge's copy of a namespace it ships (org.lwjgl) is moved in front here.
    if (parent?.path == ':bridge') {
        tasks.named('compileJava') {
            classpath = files(configurations.compileClasspath.filter { it.name.startsWith('lwjgl-') },
                    configurations.compileClasspath)
        }
    }

    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
        options.locale = 'en_US'
        options.addStringOption('Xdoclint:none', '-quiet')
    }
}

