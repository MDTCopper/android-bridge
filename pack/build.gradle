/**
 * Assembles the deployable bridge jar: dex for ART, class files for the JVM, the lwjgl classes and
 * android natives, and libcopperbridge.so - one file per bridge version.
 *
 * Only the shared half is dexed: a branch's classes reference arc and the game, which ART's class path
 * does not have. The branch runs on the JVM, from the class files this jar also carries.
 */

apply from: "$projectDir/gradle/common.gradle"
apply from: "$projectDir/gradle/lwjgl.gradle"
apply from: "$projectDir/gradle/dex.gradle"
apply from: "$projectDir/gradle/version-table.gradle"
apply from: "$projectDir/gradle/compat.gradle"
apply from: "$projectDir/gradle/jar.gradle"
