
/**
 * v3 is the FileHandle shape of the io.anuke-package 6 line: releases 100.0 up to 101.0, bleeding-edge
 * builds 5700 up to 6319. Arc renamed FileHandle to Fi on 2019-12-15, so 6315 still has the old class and
 * 6320 is the first published build with Fi; v3 starts there. 5700 is the first published build after the
 * functional types became Cons (2019-10-29).
 *
 * It compiles against 6315, the last FileHandle build with a release. The release tags 100.0 and 101.0 both
 * pin an Arc FileHandle/Cons tree, so they are checked inside the same shape.
 *
 * Everything is compile only: the game and arc jars arrive on the command line at runtime.
 */
def branch = name.startsWith('bridge-') ? name.substring('bridge-'.length()) : name
def epochClasspath = rootProject.ext.epochClasspath(branch)
def epoch = rootProject.ext.epochInfo(branch)

sourceSets {
    main {
        java.srcDirs = ["src"]
    }
}

dependencies {
    api project(':core')

    // android.jar supplies android.*; the JVM side never loads these classes.
    def sdkRoot = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
    def androidJarRoot = sdkRoot ? new File("$sdkRoot/platforms/")
            .listFiles()?.sort()?.reverse()?.find { f -> new File(f, "android.jar").exists() }
            : null
    if (androidJarRoot == null) {
        throw new GradleException("No valid Android SDK found. Set ANDROID_HOME or ANDROID_SDK_ROOT.")
    }
    compileOnly files(new File(androidJarRoot, "android.jar"))

    // the official desktop jar, which carries both game and arc.
    compileOnly epochClasspath

    // what the arc backend reaches EGL and GLES through. The version has to match the android natives
    // pack downloads, so both read lwjglVersion.
    compileOnly platform("org.lwjgl:lwjgl-bom:${property('lwjglVersion')}")
    compileOnly "org.lwjgl:lwjgl"
    compileOnly "org.lwjgl:lwjgl-egl"
    compileOnly "org.lwjgl:lwjgl-opengles"
}

tasks.named('compileJava') {
    // without the epoch's jar javac reports a wall of missing arc/mindustry symbols instead.
    doFirst {
        if (epochClasspath.isEmpty()) {
            throw new GradleException("epoch ${branch}: no jar in ${epoch.gameOut}. " +
                    "Run :prepareEpoch${branch.capitalize()}, or drop -PskipEpochPrepare.")
        }
    }
}