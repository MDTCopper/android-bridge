// --- the jar -----------------------------------------------------------------

def branchNames = project.ext.branchNames

// The class output of every module the jar carries, taken here rather than inside the task: a from {}
// closure is evaluated while the jar is built, and reaching for the project then is what the
// configuration cache refuses.
def coreOutput = project(':core').sourceSets.main.output
def branchDirs = branchNames.collectEntries { String branch ->
    [(branch): project(":bridge:${branch}").sourceSets.main.output.classesDirs.singleFile]
}
// One DEFLATE stream for every branch, not one archive per branch: the stream is written class-path-major so the
// same class in v1..v9 sits next to itself and deflate can reuse the common bytes. Format: int count, then
// (UTF name "vN/copper/bridge/vN/...class", int length, bytes). BranchClassLoader inflates it once and defines
// only the selected branch.
def branchStream = layout.buildDirectory.file('branch-stream/branches.deflate')
def branchArchive = tasks.register('branchArchive') {
    branchNames.each { dependsOn ":bridge:${it}:compileJava" }
    inputs.files(branchDirs.values())
    outputs.file(branchStream)
    doLast {
        def out = branchStream.get().asFile
        out.parentFile.mkdirs()
        new java.io.DataOutputStream(new java.util.zip.DeflaterOutputStream(new java.io.FileOutputStream(out),
                        new java.util.zip.Deflater(java.util.zip.Deflater.BEST_COMPRESSION)))
                .withCloseable { data ->
                    def byPath = new TreeMap<String, List>()
                    branchDirs.each { String branch, File dir ->
                        if (!dir.isDirectory())
                            return
                        def files = []
                        dir.eachFileRecurse { File file ->
                            if (file.name.endsWith('.class')) files.add(file)
                        }
                        files.sort { it.path }
                        files.each { File file ->
                            String relative = dir.toPath().relativize(file.toPath()).toString().replace('\\', '/')
                            byPath.computeIfAbsent(relative) { [] }.add([branch + "/" + relative, file.bytes])
                        }
                    }
                    def entries = []
                    byPath.values().each { entries.addAll(it) }
                    data.writeInt(entries.size())
                    entries.each { entry ->
                        byte[] bytes = entry[1]
                        data.writeUTF((String)entry[0])
                        data.writeInt(bytes.length)
                        data.write(bytes)
                    }
                }
    }
}

tasks.register('bridgeJar', Jar) {
    dependsOn ':core:jar'
    dependsOn branchArchive
    dependsOn 'checkBridgeApi'
    dependsOn 'fetchLwjglNatives'
    dependsOn ':native:assemble'
    dependsOn 'dexCore'
    dependsOn 'versionTable'
    dependsOn 'bridgeProperties'

    archiveFileName = "bridge-${project.version}.jar"
    destinationDirectory = layout.buildDirectory.dir('libs')

    // ART payload: the shared half only; a branch is never loaded on ART.
    from(layout.buildDirectory.dir('dex')) { include '*.dex' }

    // what both VMs read back: the branch ranges and the bridge version
    from(layout.buildDirectory.file('version-table/bridge-versions.properties'))
    from(layout.buildDirectory.file('bridge/bridge.properties'))

    // JVM payload: every class of every module, unchanged. Source set outputs rather than module jars,
    // which would drag their own manifests into the bridge jar.
    from(coreOutput)
    from(branchStream)

    // The native bridge, at the resource path copper.bridge.Bridge.prepare() reads back at runtime:
    // "native/bridge/<abi>/libcopperbridge.so". The staged libraries come from the native build.
    from(rootProject.file('native/build/output')) {
        into 'native/bridge'
    }

    // lwjgl java classes keep their package layout so arc can link against them
    from {
        configurations.lwjglJava.collect { zipTree(it) }
    } {
        exclude 'META-INF/**'
        exclude 'module-info.class'
    }

    // lwjgl android natives, under the prefix the bridge's own mapper adds to LWJGL's bundled lookup
    from(fetchLwjglNatives) {
        into 'native/lwjgl'
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
