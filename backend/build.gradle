
/**
 * The backend subproject: the JVM-side capabilities that are coupled to the platform rather than to a game
 * version. Display and input live here; files, audio and one-off host calls stay with the branch that adapts them.
 */
sourceSets {
    main {
        java.srcDirs = ["src"]
    }
}

dependencies {
    api project(':core')

    // EGL and GLES are reached through LWJGL; the version must match the android natives pack downloads.
    compileOnly platform("org.lwjgl:lwjgl-bom:${property('lwjglVersion')}")
    compileOnly "org.lwjgl:lwjgl"
    compileOnly "org.lwjgl:lwjgl-egl"
    compileOnly "org.lwjgl:lwjgl-opengles"
}
