/**
 * Build-time compatibility tool: renames the methods a branch declared under a build name, then reads the compiled
 * references into arc and mindustry and compares the declarations they use at the two ends of the branch's range.
 * Both ends are official desktop jars fetched by the epoch machinery; no game or arc build is involved.
 */
sourceSets {
    main {
        java.srcDirs = ["src"]
    }
}

dependencies {
    implementation 'org.ow2.asm:asm:9.11.1'
    implementation 'org.ow2.asm:asm-tree:9.11.1'
    implementation 'org.ow2.asm:asm-analysis:9.11.1'
    // the ClassRemapper the enhancer writes with, before the check and the branch stream
    implementation 'org.ow2.asm:asm-commons:9.11.1'
}
