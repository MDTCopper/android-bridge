# Only -Prelease uses this version; every other build is "snapshot".
buildVersion=0.1.3

# lwjgl, for the java bindings (maven) and the android natives pack downloads at build time.
lwjglVersion=3.4.1
lwjglReleaseBase=https://github.com/MDTCopper/android-lwjgl3/releases/download

# Epochs are the official desktop jars of the game, fetched by release tag or bleeding-edge build id
# and cached under .mindustry/. No game or arc clone is needed.
#
# Android SDK: android.jar on the compile classpath, and the NDK and cmake :native builds with.
# All three are pinned: another NDK or cmake changes the codegen, and the platform level has to be the
# shipped minimum.
ndkVersion=29.0.14206865
cmakeVersion=3.22.1
minAndroidApi=30

# --- version branches -------------------------------------------------------
#
# A branch declares the game jar it is compiled against and the version ranges that decide which jars
# it runs.
#
# A ref is a release tag, or a bleeding-edge build id for a branch pinned to a commit. The desktop jar
# carries arc as well, so there is no arc checkout and no arc version to track.
#
# The ranges are independent - min/maxVersionNumber for official releases, min/maxBeBuild for
# bleeding-edge build ids. An empty bound is unbounded; a scale with both bounds empty is not claimed
# by the branch at all, so that kind of jar never matches it. A jar is matched against the range for
# its release type, never across the two.

# v1 is the Audio-interface 6 line: releases 65.0 up to 83.0. It claims no bleeding-edge range: the first
# published build is 4550, whose arc already has the abstract class Audio. 84.0 is the first release whose Arc
# changed Audio from an interface to an abstract class, so v2 starts there.
#
# Its epoch is v83, the last release before that change; every symbol must also exist at 65.0.
v1.mindustryRef=v83
v1.minVersionNumber=65.0
v1.maxVersionNumber=83.0
v1.minBeBuild=
v1.maxBeBuild=

# v2 is the pre-ClientLauncher 6 line: releases 84.0 up to 91.0. 92.0 is the first release with
# ClientLauncher, so v3 starts there.
#
# Its epoch is v91, the newest release before ClientLauncher. The game starts as its own ApplicationCore
# listener with Platform.instance injected, and the network providers are installed before it runs.
v2.mindustryRef=v91
v2.minVersionNumber=84.0
v2.maxVersionNumber=91.0
v2.minBeBuild=
v2.maxBeBuild=

# v3 is the Consumer/FileHandle shape of the io.anuke-package 6 line: releases 92.0 up to 99.0, bleeding-edge
# builds 4543 up to 5699 (4543-4549 produced no release). Arc moved the functional types from`n# function.Consumer to func.Cons on 2019-10-29;
# 5700 is the first published build after that, and the last published no-Cons build is 5000 (the ids between
# have no release, so a contiguous split at 5700 loses no obtainable jar).
#
# Its epoch is v99, the newest release whose Arc is still the Consumer/FileHandle shape; every symbol the
# branch references must also exist at 4550, which :pack:checkBridgeApi enforces.
v3.mindustryRef=v99
v3.minVersionNumber=92.0
v3.maxVersionNumber=99.0
v3.minBeBuild=4543
v3.maxBeBuild=5699

# v4 is the FileHandle shape of the io.anuke-package 6 line: releases 100.0 up to 101.0, bleeding-edge
# builds 5700 up to 6319. Arc renamed FileHandle to Fi on 2019-12-15, so 6315 still has the old class and
# 6320 is the first published build with Fi; v5 starts there.
#
# Its epoch is 6315, the last FileHandle build with a release. The release tags 100.0 and 101.0 both pin
# an Arc FileHandle/Cons tree, so they are checked inside the same shape.
v4.mindustryRef=6315
v4.minVersionNumber=100.0
v4.maxVersionNumber=101.0
v4.minBeBuild=5700
v4.maxBeBuild=6319

# v5 is the Fi/Cons shape of the io.anuke-package 6 line: release 101.1, bleeding-edge builds 6320 up to
# 6425. 6426 is the first published build after both repositories dropped the io.anuke prefix, so v6 starts
# there.
#
# Its epoch is 6415, the last published io.anuke build. Release 101.1 is the only release whose arc is already
# Fi/Cons (the tag's archash is 977a1106), so it is checked inside the same shape.
v5.mindustryRef=6415
v5.minVersionNumber=101.1
v5.maxVersionNumber=101.1
v5.minBeBuild=6320
v5.maxBeBuild=6425

# v6 is the Array shape of the 6 line: releases 102.0 up to 104.6, bleeding-edge builds 6426 up to 8659.
# Arc replaced Array with Seq at 3df599fe (2020-06-08); 8660 is the first published build cut after it, so
# v7 starts there.
#
# Its epoch is 8657, the last Array build with a release. Compiling against it and checking 6426 keeps
# every reference inside the Array shape; v104.6 and v102 are inside that range on the release scale.
v6.mindustryRef=8657
v6.minVersionNumber=102.0
v6.maxVersionNumber=104.6
v6.minBeBuild=6426
v6.maxBeBuild=8659

# v7 is the 6 line's old audio shape: releases 105.0 up to 113.2, bleeding-edge builds 8660 up to 11234.
# 8660 is the first published build cut after arc replaced Array with Seq (the build at 8656 still had Array).
# The enum constants inside the range were renamed from capitalized to lowercase, which the branch reads by
# ordinal. 11234 is the last build that still declares the abstract arc.Audio with newSound/newMusic, which is
# what this branch implements; 11247 is the first without it, and v8 starts there.
#
# Its epoch is v112: the newest release whose arc.Audio is still that abstract class. 113 turned it into
# the SoLoud shape, so this branch cannot compile against it, and the 11234 build already carries
# arc.audio.SoloudAudio, which BridgeApplication reaches by name.
v7.mindustryRef=v112
v7.minVersionNumber=105.0
v7.maxVersionNumber=113.2
v7.minBeBuild=8660
v7.maxBeBuild=11234

# v8 is the rest of the 6 line and the whole 7 and 8 line: releases 114.0 up (open at the top), bleeding-edge
# builds 11247 up, stopping at the last 8 build (27928). 11247 is the first build with the concrete
# arc.audio.Audio and without the abstract one. Its epoch is v159, the newest shape the branch meets; every
# symbol it references must also exist at the range's floor, which :pack:checkBridgeApi enforces.
v8.mindustryRef=v159
v8.minVersionNumber=114.0
v8.maxVersionNumber=
v8.minBeBuild=11247
# 27928 is the last build of the v8 line. 27929 was the first cut of Mindustry 9: it failed and
# produced no release, but the id is spent, so that is where the v9 range starts.
v8.maxBeBuild=27928

# v9: Mindustry 9, the epoch where Arc was merged into the game repository. Upstream has no v9 tag
# yet, so the epoch is the bleeding-edge build cut from the current v9 commit (800f2316f7) and the ref
# is bumped by hand when the branch moves. The branch switches on bleeding-edge build ids at 27929;
# there is no official v9 release yet, so the release range stays undeclared and this entry claims no
# release at all. Add minVersionNumber when the first v9 release exists - until then such a jar
# resolves to the closest branch with a warning instead of silently running the wrong one.
v9.mindustryRef=28063
v9.minVersionNumber=
v9.maxVersionNumber=
v9.minBeBuild=27929
v9.maxBeBuild=

# Epoch jars land in .mindustry/<ref>/ as Mindustry.jar; the fetched file is not committed.

# --- API check --------------------------------------------------------------
#
# The check reads the compiled branch classes and compares the declarations they reference at the two
# ends of the branch's range, both ends being official desktop jars that the epoch machinery stages. A
# ref is a release tag or a bleeding-edge build id. A class that is only loaded on newer epochs
# overrides its file's ends with @CompatRange; a ref it names beyond the two ends below and the branch
# epoch goes into <branch>.compatRefs, comma separated.

v1.compatFloor=v65
v1.compatCeiling=v83

v2.compatFloor=v84
v2.compatCeiling=v91

v3.compatFloor=4550
v3.compatCeiling=v99

v4.compatFloor=5700
v4.compatCeiling=6315

v5.compatFloor=6320
v5.compatCeiling=6415

v6.compatFloor=6426
v6.compatCeiling=8657

v7.compatFloor=8660
v7.compatCeiling=11234

v8.compatFloor=11247
v8.compatCeiling=27928

v9.compatFloor=27930
v9.compatCeiling=28063
