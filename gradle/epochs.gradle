// --- epochs -----------------------------------------------------------------
//
// A branch compiles against one game epoch: the official desktop jar of a release tag, or of a
// bleeding-edge build. The desktop jar already contains arc, so no clone is checked out and nothing is
// built. A jar is fetched once into .mindustry/<ref>/ - which survives clean and is not committed - and
// read from there by both classpath halves. This file is the only place that knows how a ref becomes a
// jar; the API check reads the staged files it is handed.

/** Where one ref's jar is staged. */
ext.epochDir = { String ref -> new File(rootProject.projectDir, ".mindustry/${ref}") }

/** The staged jar of one ref, or null when it has not been fetched. */
ext.epochJarFile = { String ref ->
    def dir = epochDir(ref)
    if (!dir.isDirectory())
        return null
    return dir.listFiles()?.find { it.name.endsWith('.jar') }
}

/** The official desktop jar for a release tag, or for a bleeding-edge build id; older tags name it differently. */
ext.epochUrls = { String ref ->
    if (ref ==~ /\d+/)
        return ["https://github.com/Anuken/MindustryBuilds/releases/download/${ref}/Mindustry-BE-Desktop-${ref}.jar"]
    return [
            "https://github.com/Anuken/Mindustry/releases/download/${ref}/Mindustry.jar",
            "https://github.com/Anuken/Mindustry/releases/download/${ref}/desktop-release.jar"
    ]
}

/** Fetches one ref once. A partial download keeps its .part name, so a failed run is not read as a jar. */
ext.fetchEpoch = { String ref ->
    def staged = epochJarFile(ref)
    if (staged != null)
        return staged

    def dir = epochDir(ref) as File
    def part = new File(dir, 'Mindustry.jar.part')
    dir.mkdirs()
    Throwable failure = null
    for (String url : epochUrls(ref)) {
        logger.lifecycle("epoch ${ref}: fetching ${url}")
        try {
            def connection = new URI(url).toURL().openConnection()
            connection.connectTimeout = 30000
            connection.readTimeout = 600000
            connection.inputStream.withStream { input ->
                part.withOutputStream { output -> output << input }
            }
            if (part.isFile() && part.length() > 0) {
                def jar = new File(dir, 'Mindustry.jar')
                if (!part.renameTo(jar))
                    throw new GradleException("epoch ${ref}: could not rename ${part} to ${jar}")
                return jar
            }
        } catch (Throwable e) {
            failure = e
            part.delete()
        }
    }
    throw new GradleException("epoch ${ref}: no jar at ${epochUrls(ref)}", failure)
}

/** Where one branch's epoch lives, and which ref produces it. */
ext.epochInfo = { String branch ->
    def ref = property("${branch}.mindustryRef")
    return [branch: branch, ref: ref, gameOut: epochDir(ref)]
}

/** The one jar a branch compiles against: the desktop jar carries the game and arc together. */
ext.epochClasspath = { String branch ->
    fileTree(epochInfo(branch).gameOut) {
        include '*.jar'
        exclude '*-sources.jar'
        exclude '*-javadoc.jar'
    }
}

/** Stages one branch's epoch. */
ext.prepareEpoch = { String branch -> fetchEpoch(epochInfo(branch).ref) }

/** Whether a branch subproject has any code yet; pack asks the same question when it builds the jar. */
ext.branchHasSources = { String branch ->
    !fileTree("bridge-${branch}/src") { include '**/*.java' }.isEmpty()
}

// The subprojects that carry an epoch: one per version branch.
def epochNames = ['v1', 'v2', 'v3', 'v4', 'v5', 'v6', 'v7', 'v8', 'v9']

// Only epochs whose code is there are prepared, so a fresh checkout does not fetch every jar to compile
// one. -Pepochs=v1 picks explicitly.
if (!project.hasProperty('skipEpochPrepare')) {
    def wanted = project.hasProperty('epochs')
            ? (project.property('epochs') as String).split(',').collect { it.trim() }.findAll { it }
            : epochNames.findAll { branchHasSources(it) }
    wanted.each { String branch -> prepareEpoch(branch) }
}

// The escape hatch for fetching an epoch again, after a failed download or a moved ref.
epochNames.each { String branch ->
    tasks.register("prepareEpoch${branch.capitalize()}") {
        group = 'epoch'
        description = "Fetches the ${branch} epoch jar again."
        doLast {
            delete epochDir(epochInfo(branch).ref)
            prepareEpoch(branch)
        }
    }
}
