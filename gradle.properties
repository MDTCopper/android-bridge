buildVersion=0.1.0

# lwjgl, for the java bindings (maven) and the android natives pack downloads at build time.
lwjglVersion=3.4.1
lwjglReleaseBase=https://github.com/MDTCopper/android-lwjgl3/releases/download

# The full Mindustry and Arc clones, the source of every epoch. Both must be full clones: the epochs
# below are checked out by tag from them.
mindustryDir=../Mindustry
arcDir=../Arc

# Android SDK: android.jar on the compile classpath, and the NDK and cmake :native builds with.
# All three are pinned: another NDK or cmake changes the codegen, and the platform level has to be the
# shipped minimum.
ndkVersion=29.0.14206865
cmakeVersion=3.22.1
minAndroidApi=30

# --- version branches -------------------------------------------------------
#
# A branch declares two independent ranges - min/maxVersionNumber for official releases,
# min/maxBeBuild for bleeding-edge build ids. An empty bound is unbounded; a jar is matched against
# the range for its release type, never across the two.
#
# One branch, open at the top: 146.0 / build 24369 are the oldest versions supported, not a boundary
# derived from an interface change. The epoch below is the newest shape the branch meets; every symbol
# it references must also exist at the floor, which the compiler does not check. The four @Override
# annotations that had to go to compile there must not come back.
#
# The arc coordinate is build time only: the arc release tag, or the archash that commit declares.

v1.mindustryTag=v159
v1.arcTag=v159
v1.arcHash=6aee8e76869d60b411e61575a5be1b452f2030a4
v1.minVersionNumber=146.0
v1.maxVersionNumber=
v1.minBeBuild=24369
v1.maxBeBuild=

# Epoch artifacts land in .mindustry/<mindustryTag>/ and .arc/<mindustryTag>/; the arc ref is arcTag,
# or arcHash when the epoch has no arc tag.

# --- verification epoch -----------------------------------------------------
#
# Not a branch: no sources, nothing in the jar is compiled against it. It is the newest *older* shape
# the branch still has to work on, so a person can compile the same sources against it and see whether
# they reference anything missing further back. Nothing prepares it by default; :prepareEpochVerify
# builds it on request. It is not a substitute for running the branch on those versions - that is the
# judge.
#
#   gradlew :prepareEpochVerify

verify.mindustryTag=v151
verify.arcTag=v151
verify.arcHash=c93f3ff4cb12e91657c692fc181c4b84b32968fc