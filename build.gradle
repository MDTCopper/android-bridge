// Build logic lives in gradle/: the version stamp, the epoch machinery, and the API check that pack applies.
// This file only applies them and holds the settings shared by every Java subproject.

apply from: "$rootDir/gradle/version.gradle"
apply from: "$rootDir/gradle/epochs.gradle"

configure(subprojects - project(':native')) {
    apply plugin: 'java-library'

    group = 'com.github.MDTCopper.bridge'
    version = buildVersion

    java {
        // both sides share the classes, and the ART side runs on Android 11 (API 30), so Java 11
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-Xlint:deprecation']
    }

    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
        options.locale = 'en_US'
        options.addStringOption('Xdoclint:none', '-quiet')
    }
}

// A branch may use classes from any lower branch, not only the one before it. All lower branches are on its
// compile classpath; the API check follows the same edges backwards and validates every used class at this
// branch's ends.
configure(subprojects.findAll { it.name ==~ /bridge-v\d+/ }) {
    def version = it.name.substring('bridge-v'.length()) as int
    dependencies {
        api project(':backend')
    }
    if (version > 1) {
        dependencies {
            for (int lower = 1; lower < version; lower++)
                compileOnly project(":bridge-v${lower}")
        }
    }
}
