// --- version table -----------------------------------------------------------
//
// The table is generated from the declarations in gradle.properties, so what the jar says about a
// branch is exactly what that branch was compiled and dexed with. Nothing is inferred at runtime.

def branchNames = project.ext.branchNames

def versionBlocks = branchNames.collect { String branch ->
    def ref = property("${branch}.mindustryRef")
    [
            name            : branch,
            target          : "Mindustry ${ref}",
            mindustryRef    : ref,
            minVersionNumber: property("${branch}.minVersionNumber"),
            maxVersionNumber: findProperty("${branch}.maxVersionNumber") ?: '',
            minBeBuild      : property("${branch}.minBeBuild"),
            maxBeBuild      : findProperty("${branch}.maxBeBuild") ?: ''
    ]
}

tasks.register('versionTable') {
    group = 'pack'
    description = "Aggregates each branch's declared version ranges into the shipped version table."
    def output = layout.buildDirectory.file('version-table/bridge-versions.properties').get().asFile
    def blocks = versionBlocks
    // the blocks are the task's input: without this a branch added later would be missing from the table.
    inputs.property('blocks', blocks)
    outputs.file(output)
    doLast {
        def text = new StringBuilder("# generated by :pack:versionTable, one block per branch in this jar\n")
        text.append("count=${blocks.size()}\n")
        blocks.eachWithIndex { block, index ->
            text.append("\n# ${block.name} vs ${block.target}\n")
            def prefix = "branch.${index}."
            ['name', 'target', 'mindustryRef',
             'minVersionNumber', 'maxVersionNumber', 'minBeBuild', 'maxBeBuild'].each { String key ->
                text.append("${prefix}${key}=${block[key]}\n")
            }
        }
        output.parentFile.mkdirs()
        output.text = text.toString()
        logger.lifecycle("version table: ${blocks.collect { it.name }.join(', ')}")
    }
}

/**
 * Writes the version marker the ART side reads back from its own class loader
 * ({@code copper.bridge.art.Main}); without the resource it can only print its placeholder. A snapshot
 * also says which commit it came from, or that it is a custom build, because every snapshot shares the
 * one version.
 */
tasks.register('bridgeProperties') {
    group = 'pack'
    description = "Writes the version marker resource the ART side reads."
    def output = layout.buildDirectory.file('bridge/bridge.properties').get().asFile
    def version = project.version
    // both stay empty on a release: its version names the commit by itself
    def commit = project.buildCommit
    def custom = project.buildCustom
    // the version and the commit are what this file is made of, so both are inputs like any other
    inputs.property('version', version)
    inputs.property('commit', commit)
    inputs.property('custom', custom)
    outputs.file(output)
    doLast {
        output.parentFile.mkdirs()
        output.text = "version=${version}\n" + (custom ? "custom=true\n" : commit ? "commit=${commit}\n" : "")
    }
}
