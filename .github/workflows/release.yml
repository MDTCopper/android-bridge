name: Build and Release

# A push to main and a version tag both update the snapshot release, from the commit that was pushed.
# A tag also publishes the versioned release, built with -Prelease - the only thing that lets the
# version in gradle.properties reach an artifact.
on:
  push:
    branches:
      - main
    # Version tags start with a digit; the "snapshot" tag must not build a release of its own.
    tags:
      - '[0-9]*'

# A newer snapshot supersedes an older one; a tagged run is never cancelled by a push to main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_type == 'tag' && github.ref_name || 'snapshot' }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

permissions: {}

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest

    permissions:
      contents: write # for the release, its assets, and the snapshot tag

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'

      # The three repositories, side by side in the run directory and nothing cloned from outside it.
      # The bridge's own repository is cloned too - at the revision this workflow is running for,
      # which is why it is a checkout by commit rather than a plain clone of a branch.
      - name: Checkout Arc, Mindustry and the bridge
        run: |
          git clone --filter=blob:none https://github.com/Anuken/Arc.git Arc
          git clone --filter=blob:none https://github.com/Anuken/Mindustry.git Mindustry
          git clone --filter=blob:none https://github.com/${{ github.repository }}.git Bridge
          git -C Bridge checkout --detach ${{ github.sha }}

      - name: Grant execute permission for gradlew
        working-directory: Bridge
        run: chmod +x gradlew

      # Versions come from gradle.properties: the platform level the branch supports, and the exact
      # NDK and cmake the shipped .so is built with (a different NDK changes the codegen).
      - name: Install Android SDK, NDK and CMake
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      # An epoch is built from full clones of the game and arc, which gradle.properties names as
      # ../Mindustry and ../Arc - from inside Bridge/ that is exactly where the clones above landed.
      # The jar's own task pulls in the rest: the generators (the JNI binding and the bus tables), the
      # branch compiled against its epoch, the native library for every ABI, and pack's own steps.
      # Only a tag gets this pass: -Prelease is what puts the version into the artifact.
      - name: Build the release jar
        if: github.ref_type == 'tag'
        working-directory: Bridge
        run: |
          ./gradlew :pack:bridgeJar -Prelease
          mkdir -p "$GITHUB_WORKSPACE/artifacts/release"
          mv pack/build/libs/*.jar "$GITHUB_WORKSPACE/artifacts/release/"

      # Every run ends with this pass, and each pass moves its jar out, so neither release can pick up
      # the other's. The second pass only reruns what the version reaches.
      - name: Build the snapshot jar
        working-directory: Bridge
        run: |
          ./gradlew :pack:bridgeJar
          mkdir -p "$GITHUB_WORKSPACE/artifacts/snapshot"
          mv pack/build/libs/*.jar "$GITHUB_WORKSPACE/artifacts/snapshot/"

      - name: Publish Release and Upload Artifacts
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          generate_release_notes: true
          files: |
            artifacts/release/*.jar

      # Updating a release leaves its tag where it was, so move the snapshot tag (absent on the first
      # run) to this commit.
      - name: Point the snapshot tag at this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/snapshot" > /dev/null 2>&1; then
            gh api --method PATCH "repos/${{ github.repository }}/git/refs/tags/snapshot" \
              -f sha="${{ github.sha }}" -F force=true
          fi

      # The action replaces the asset of the same name, so this stays the same release.
      - name: Publish or Update the Snapshot Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: snapshot
          target_commitish: ${{ github.sha }}
          name: Snapshot
          prerelease: true
          body: |
            The newest build (`${{ github.sha }}`), replaced on every push.

            No version number: the artifact is `bridge-snapshot.jar`. Use a versioned release for
            something that does not move.
          files: |
            artifacts/snapshot/*.jar
