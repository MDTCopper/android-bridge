/**
 * v1 is the libGDX/uCore line: releases 33 up to 57. Those tags predate Arc, so the desktop jar carries
 * libGDX and uCore instead; it claims no bleeding-edge range and has no arc revision to track.
 *
 * Its epoch is v57, the newest shape. Every symbol the branch references must also exist at 33, which
 * :pack:checkBridgeApi enforces.
 *
 * Everything is compile only: the game jar arrives on the command line at runtime.
 */
def branch = name.startsWith('bridge-') ? name.substring('bridge-'.length()) : name
def epochClasspath = rootProject.ext.epochClasspath(branch)
def epoch = rootProject.ext.epochInfo(branch)

def sdkRoot = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
def androidJarRoot = sdkRoot ? new File("$sdkRoot/platforms/")
        .listFiles()?.sort()?.reverse()?.find { f -> new File(f, "android.jar").exists() }
        : null
if (androidJarRoot == null) {
    throw new GradleException("No valid Android SDK found. Set ANDROID_HOME or ANDROID_SDK_ROOT.")
}
// 33 keeps Platform in io.anuke.mindustry.io; 40 moved it to io.anuke.mindustry.core. The legacy source set
// compiles its subclass against the floor, so the old package never appears in the main sources.
def floorJar = rootProject.ext.fetchEpoch('v33')

sourceSets {
    main {
        java.srcDirs = ["src"]
    }
    legacy {
        java.srcDirs = ["legacy"]
    }
}

dependencies {
    api project(':core')

    // android.jar supplies android.*; the JVM side never loads these classes.
    compileOnly files(new File(androidJarRoot, "android.jar"))

    // the official desktop jar, which carries the game, libGDX and uCore.
    compileOnly epochClasspath

    // what the bridge reaches EGL and GLES through. The version has to match the android natives
    // the caller stages, so both read lwjglVersion.
    compileOnly platform("org.lwjgl:lwjgl-bom:${property('lwjglVersion')}")
    compileOnly "org.lwjgl:lwjgl"
    compileOnly "org.lwjgl:lwjgl-egl"
    compileOnly "org.lwjgl:lwjgl-opengles"

    // The legacy source set compiles against the floor, not the branch epoch: that is the only way the
    // io.anuke.mindustry.io.Platform type can appear in a subclass. Its classes ship in the same branch and
    // are picked at runtime.
    legacyImplementation project(':core')
    legacyCompileOnly files(sourceSets.main.output.classesDirs.singleFile)
    legacyCompileOnly files(new File(androidJarRoot, "android.jar"))
    legacyCompileOnly files(floorJar)
}

tasks.named('classes') {
    dependsOn 'compileLegacyJava'
}

tasks.named('compileLegacyJava') {
    dependsOn 'compileJava'
}

tasks.named('compileJava') {
    // without the epoch's jar javac reports a wall of missing libGDX/uCore symbols instead.
    doFirst {
        if (epochClasspath.isEmpty()) {
            throw new GradleException("epoch ${branch}: no jar in ${epoch.gameOut}. " +
                    "Run :prepareEpoch${branch.capitalize()}, or drop -PskipEpochPrepare.")
        }
    }
}
